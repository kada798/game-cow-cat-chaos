<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Moo Cat Mischief - Playable Ad Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="phone" id="game" aria-label="Moo Cat Mischief playable ad prototype">
    <div class="room">
      <div class="wall-art"></div>
      <div class="window"></div>
      <div class="floor"></div>

      <header class="hud">
        <div class="title">Moo Cat Mischief</div>
        <div class="hint" id="hint">Tap the tangled yarn!</div>
        <div class="progress" id="progress" aria-label="Scene progress">
          <span class="dot is-active"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </header>

      <!-- Scene 1: catch the cat and rescue the stolen yarn. -->
      <section class="scene is-active" data-scene="closet">
        <div class="wardrobe"></div>
        <div class="fur-collar"></div>
        <button class="yarn-mess" id="yarnMess" aria-label="Save the tangled yarn">
          <span class="yarn-thread thread-one"></span>
          <span class="yarn-thread thread-two"></span>
          <span class="yarn-thread thread-three"></span>
          <span class="yarn-ball floor-yarn" aria-hidden="true"></span>
        </button>
        <div class="cat-wrap closet-cat" id="closetCat" aria-label="Cat caught making a yarn mess">
          <span class="cat">
            <span class="tail"></span>
            <span class="cat-body"></span>
            <span class="cat-head">
              <span class="eye left"></span>
              <span class="eye right"></span>
              <span class="nose"></span>
              <span class="mouth"></span>
            </span>
          </span>
          <span class="meow-bubble">MEOW!</span>
        </div>
        <div class="caption">Yarn rescued!</div>
      </section>

      <!-- Scene 2: ring the electric mouse toy to save Dad's head. -->
      <section class="scene" data-scene="dad">
        <div class="tv" aria-hidden="true"></div>
        <div class="dad"></div>
        <div class="cabinet"></div>
        <span class="danger-lines" aria-hidden="true"></span>
        <span class="tap-mark"></span>
        <div class="cat-wrap dad-cat" id="dadCat" aria-label="Mischievous cat on Dad's head">
          <span class="cat">
            <span class="tail"></span>
            <span class="cat-body"></span>
            <span class="cat-head">
              <span class="eye left"></span>
              <span class="eye right"></span>
              <span class="nose"></span>
              <span class="mouth"></span>
            </span>
          </span>
        </div>
        <button class="toy" id="toy" aria-label="Ring the electric mouse toy">
          <span class="mouse-ear"></span>
          <span class="mouse-wheel"></span>
          <span class="ring"></span>
        </button>
        <div class="caption">Dad is safe... for now.</div>
      </section>

      <!-- Scene 3: rescue the teddy from the cat's sleeping chair. -->
      <section class="scene" data-scene="teddy">
        <div class="chair"></div>
        <button class="teddy" id="teddy" aria-label="Rescue the plush teddy bear">
          <span class="teddy-ear left"></span>
          <span class="teddy-ear right"></span>
          <span class="teddy-face"></span>
          <span class="teddy-arm left"></span>
          <span class="teddy-arm right"></span>
        </button>
        <div class="cat-wrap chair-cat" id="chairCat" aria-label="Cat swatting the teddy bear">
          <span class="cat">
            <span class="tail"></span>
            <span class="cat-body"></span>
            <span class="swat-paw"></span>
            <span class="cat-head">
              <span class="eye left"></span>
              <span class="eye right"></span>
              <span class="nose"></span>
              <span class="mouth"></span>
            </span>
          </span>
        </div>
        <div class="caption">Teddy rescued!</div>
      </section>

      <!-- Final payoff and CTA. -->
      <section class="scene" data-scene="ending">
        <div class="sofa"></div>
        <div class="hand"></div>
        <button class="cat-button ending-cat" id="endingCat" aria-label="Pet the affectionate cow cat">
          <span class="cat">
            <span class="tail"></span>
            <span class="cat-body"></span>
            <span class="cat-head">
              <span class="eye left"></span>
              <span class="eye right"></span>
              <span class="nose"></span>
              <span class="mouth"></span>
            </span>
          </span>
          <span class="meow-bubble">MEOW!</span>
        </button>
        <div class="caption">He missed you too.</div>
      </section>

      <button class="cta" id="cta">Play More</button>
      <div class="sparkles" id="sparkles"></div>
    </div>
  </main>
  <script src="script.js" defer></script>
</body>
</html>
